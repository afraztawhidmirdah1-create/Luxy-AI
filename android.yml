name: Build Luxy AI for Google Play

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Put your repo and Google settings into the app
        run: |
          sed -i "s#YOUR-USER/YOUR-REPO#${{ github.repository }}#" www/index.html
          if [ -n "${{ secrets.GOOGLE_WEB_CLIENT_ID }}" ]; then sed -i "s#PASTE_YOUR_WEB_CLIENT_ID.apps.googleusercontent.com#${{ secrets.GOOGLE_WEB_CLIENT_ID }}#" www/index.html; fi

      - name: Create Android project
        run: npx cap add android

      - name: Permissions and version number
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' $M
          sed -i 's#<application#<queries><intent><action android:name="android.speech.RecognitionService" /></intent><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n    <application#' $M
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "permission" $M

      - name: App icons
        run: npx capacitor-assets generate --android

      - name: Sync web files
        run: npx cap sync android

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK (test) and AAB (Google Play)
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease

      - name: Sign the AAB for Google Play
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cp android/app/build/outputs/bundle/release/app-release.aab luxy-ai-release.aab
          jarsigner -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -sigalg SHA256withRSA -digestalg SHA-256 luxy-ai-release.aab "$KEY_ALIAS"

      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: Luxy-AI-builds
          if-no-files-found: ignore
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            luxy-ai-release.aab
